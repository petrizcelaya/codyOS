# === CONFIGURACIÓN DE TAMAÑO DE LETRA PARA CRT (800x600) ===
# La leen codyos.sh y cfest_timeline.sh al arrancar.
# Solo funciona en la consola de la Raspberry (no por SSH ni en ventana).
# Para probar otra fuente: comenta la línea activa (#) y descomenta otra.
# Para ver cómo se ven todas en el monitor: ./probar_fuentes.sh
#
# Cuánto cabe en 800x600 con cada tamaño:
#   12x6  -> 133 columnas x 50 líneas  (caben los logos de 120)
#   14    -> 100 columnas x 42 líneas
#   16    -> 100 columnas x 37 líneas  (cabe todo el código)
#   20x10 ->  80 columnas x 30 líneas  (1 línea del código se parte)
#   24x12 ->  66 columnas x 25 líneas  (13 líneas del código se parten)
#   28x14 ->  57 columnas x 21 líneas
#   32x16 ->  50 columnas x 18 líneas
# Las fuentes "Bold" se ven más gruesas, ayudan en el CRT.

# --- Letra para los logos (deben caber 120 columnas) ---
FUENTE_LOGOS="Lat15-Terminus12x6"
#FUENTE_LOGOS="Lat15-Fixed13"

# --- Letra para el código y los hitos ---
FUENTE_CODIGO="Lat15-TerminusBold20x10"
#FUENTE_CODIGO="Lat15-TerminusBold16"
#FUENTE_CODIGO="Lat15-Terminus20x10"
#FUENTE_CODIGO="Lat15-TerminusBold24x12"
#FUENTE_CODIGO="Lat15-TerminusBold28x14"
#FUENTE_CODIGO="Lat15-VGA16"
