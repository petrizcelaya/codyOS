# === CONFIGURACIÓN DE COLORES PARA CRT ===
# La leen codyos.sh y cfest_timeline.sh al arrancar.
# Para probar otro color: comenta la línea activa (#) y descomenta otra.
# Para ver cómo se ven todos en el monitor: ./probar_colores.sh

# --- Color del código (texto que corre) ---
COLOR_CODIGO="\e[1;37m"          # Blanco brillante
#COLOR_CODIGO="\e[0;32m"         # Verde clásico (se pierde en el CRT)
#COLOR_CODIGO="\e[1;32m"         # Verde brillante
#COLOR_CODIGO="\e[1;36m"         # Cian brillante
#COLOR_CODIGO="\e[0;36m"         # Cian
#COLOR_CODIGO="\e[1;33m"         # Amarillo brillante
#COLOR_CODIGO="\e[38;5;46m"      # Verde neón (256 colores)
#COLOR_CODIGO="\e[38;5;51m"      # Cian neón (256 colores)
#COLOR_CODIGO="\e[38;5;214m"     # Ámbar tipo terminal vieja (256 colores)
#COLOR_CODIGO="\e[38;2;0;255;0m" # Verde puro RGB (requiere truecolor)

# --- Color de los hitos (mensajes destacados) ---
COLOR_HITO="\e[1;33m"            # Amarillo brillante
#COLOR_HITO="\e[1;36m"           # Cian brillante
#COLOR_HITO="\e[1;37m"           # Blanco brillante
#COLOR_HITO="\e[38;5;214m"       # Ámbar (256 colores)

# --- Color de cada logo (si lo dejas vacío "" usa el color del código) ---
COLOR_LOGO_OLD="\e[1;36m"        # logoold.txt
COLOR_LOGO_CODYOS="\e[1;37m"     # logo.txt (CODY OS)
COLOR_LOGO_MS="\e[1;34m"         # logoMS.txt (Microsoft)
# Opciones: \e[1;31m rojo  \e[1;32m verde  \e[1;33m amarillo  \e[1;34m azul
#           \e[1;35m magenta  \e[1;36m cian  \e[1;37m blanco  \e[38;5;214m ámbar

# --- No cambiar ---
COLOR_RESET="\e[0m"              # Limpiar color
